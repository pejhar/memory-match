plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv("KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
def releaseKeyPassword = System.getenv("KEY_PASSWORD")

android {
    namespace 'ir.keynu.taptile2'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.keynu.taptile2'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '2.0.7'
    }

    signingConfigs {
        release {
            if (!releaseKeystorePath || !releaseKeystorePassword || !releaseKeyAlias || !releaseKeyPassword) {
                throw new GradleException(
                    "Release signing is not configured. Set KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
                )
            }

            def keystoreFile = file(releaseKeystorePath)
            if (!keystoreFile.exists()) {
                throw new GradleException("Release keystore not found: ${keystoreFile.absolutePath}")
            }

            storeFile keystoreFile
            storePassword releaseKeystorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {}
