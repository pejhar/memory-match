plugins { id 'com.android.application' }

android {
    namespace 'ir.keynu.taptile'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.keynu.taptile'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies {}
