name: Build Android Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: '8.10.2'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "Checking Android SDK Platform 35..."
          test -d "${ANDROID_HOME}/platforms/android-35"
          echo "Android SDK Platform 35: OK"
          echo "Checking Android Build Tools 35.0.0..."
          test -d "${ANDROID_HOME}/build-tools/35.0.0"
          echo "Android Build Tools 35.0.0: OK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build release APK
        run: |
          gradle --no-daemon --stacktrace assembleRelease

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          echo "Release APK generated successfully:"
          ls -lh "$APK"

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Tap-Tile-${GITHUB_SHA::7}-release.apk"
          ls -lh release/

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: tap-tile-release-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Tap Tile ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
