name: Build Android Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: '8.10.2'

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms/android-35"
          test -d "${ANDROID_HOME}/build-tools/35.0.0"
          echo "Android SDK Platform 35 and Build Tools 35.0.0: OK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Check release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || { echo "ERROR: KEYSTORE_BASE64 is missing."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ERROR: KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: KEY_ALIAS is missing."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: KEY_PASSWORD is missing."; exit 1; }

          echo "All release signing secrets are present."

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tap-tile-release.jks"
          test -s "$RUNNER_TEMP/tap-tile-release.jks"

          echo "Release keystore decoded successfully."

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/tap-tile-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleRelease

      - name: Verify release APK and signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APK"
          test -x "$APKSIGNER"

          echo "Release APK:"
          ls -lh "$APK"

          echo "Verifying APK signature..."
          "$APKSIGNER" verify --verbose "$APK"

          echo "APK signature verification: OK"

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk             "release/Tap-Tile-${GITHUB_SHA::7}-release.apk"

          ls -lh release/

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: tap-tile-release-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Tap Tile ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
